name: ci

on:
  pull_request:
  push:
    branches: [main]

# Minimal permissions: only what's needed for checkout, cache and
# artifact upload. (CodeRabbit Major: explicitly restrict the GITHUB_TOKEN
# so the workflow cannot accidentally use repo write/admin scopes.)
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - name: 22
            version: 22.x
          - name: lts
            version: lts/*
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node.name }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node.version }}
          check-latest: ${{ matrix.node.name == 'lts' }}

      - name: Get Node.js version
        id: node-version
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Cache npm and Nx
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .nx/cache
          key: ${{ runner.os }}-node-${{ steps.node-version.outputs.version }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.node-version.outputs.version }}-npm-

      - name: Install
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: End-to-end smoke build
        run: npm run abapdoc -- build --src e2e/petstore --out dist/petstore-docs

      - name: Upload generated docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petstore-docs-${{ matrix.node.name }}
          path: dist/petstore-docs
          retention-days: 7
